title: Géostandards de Réseaux enterrés des eaux - StaR-Eau
description: Le standard de données StaR-Eau fait évoluer le standard de données RAEPA. Il est destiné à tous les acteurs autour des services de distribution d’eau potable, d’assainissement collectif et de gestion des eaux pluviales en zone urbaine. Il a pour objectif de répondre à des besoins métiers, aux obligations réglementaires et de permettre de meilleurs échanges d’informations.
homepage: https://github.com/cnigfr/StaR-Eau/
version: 1.0.0